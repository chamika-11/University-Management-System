version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: ulms-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: ulms-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: ulms-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: ulms-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ulms-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: ulms-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: ulms-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  api-gateway:
    build: ../../api-gateway
    container_name: ulms-api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - mongodb
      - user-service
    environment:
      - PORT=8000
      - REDIS_URI=redis://redis:6379
      - USER_SERVICE_URL=http://user-service:3000
      - ACADEMIC_SERVICE_URL=http://academic-service:3000
      - ADMISSION_SERVICE_URL=http://admission-service:3000
      - CONTENT_SERVICE_URL=http://content-service:3000
      - ASSESSMENT_SERVICE_URL=http://assessment-service:3000
      - EXAMINATION_SERVICE_URL=http://examination-service:3000
      - GRADING_SERVICE_URL=http://grading-service:3000
      - TIMETABLE_SERVICE_URL=http://timetable-service:3000
      - FINANCE_SERVICE_URL=http://finance-service:3000
      - LIBRARY_SERVICE_URL=http://library-service:3000
      - NOTIFICATION_SERVICE_URL=http://notification-service:3000
      - FORUM_SERVICE_URL=http://forum-service:3000
      - DOCUMENT_SERVICE_URL=http://document-service:3000
      - REPORTING_SERVICE_URL=http://reporting-service:3000
      - SEARCH_SERVICE_URL=http://search-service:3000
      - AI_RAG_SERVICE_URL=http://ai-rag-service:8000
      - JWT_SECRET=supersecretkey

  user-service:
    build: ../../services/user-service
    container_name: ulms-user-service
    ports:
      - "5002:3000"
    depends_on:
      - mongodb
      - redis
      - kafka
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/user_db
      - REDIS_URI=redis://redis:6379
      - KAFKA_BROKERS=kafka:29092
      - JWT_SECRET=supersecretkey

  academic-service:
