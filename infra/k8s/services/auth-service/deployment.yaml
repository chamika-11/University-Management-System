apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ulms-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ulms-registry.org/auth-service:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGODB_URI
              value: "mongodb://mongodb-headless.stateful.svc.cluster.local:27017/auth_db"
            - name: REDIS_URI
              value: "redis://redis-master.stateful.svc.cluster.local:6379"
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap.stateful.svc.cluster.local:9092"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
