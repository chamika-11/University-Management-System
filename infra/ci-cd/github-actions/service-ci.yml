name: Microservice CI

on:
  push:
    paths:
      - 'services/**'
      - 'shared-libs/**'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Monorepo Deps
        run: npm install
      - name: Run Lint
        run: npm run lint --if-present
      - name: Run Tests
        run: npm run test --if-present
